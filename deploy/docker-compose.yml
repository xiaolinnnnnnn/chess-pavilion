services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: yige-app:latest
    container_name: yige-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:27015:27015"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
